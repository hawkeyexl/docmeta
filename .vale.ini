# House voice for every document this repo writes. The Moose package enables
# the Voices core, the Direct voice, and the Moose house rules for all Markdown
# and text files. Authored prose gets no exemption. README, ADRs, CLAUDE.md,
# and the docs site are all held to the same voice.
#
# CHANGELOG.md is the one carve-out, and it is not a backlog. semantic-release
# writes it from commit messages, so there is no author to hold to a voice and
# no file anyone can rewrite. Without the exemption a release would fail the
# check on prose nobody chose. It lives here rather than in the workflow so a
# local run and CI agree on it.
#
# Two kinds of file still carry alerts on purpose, and neither is exempt.
# CODE_OF_CONDUCT.md is Contributor Covenant 2.1 adopted verbatim, and the
# proposals marked `Superseded by NNNN` are historical records CLAUDE.md forbids
# editing. Both are held to the voice so that anyone who does rewrite them is
# told. Neither can fail CI as it stands, because the workflow annotates only
# the lines a pull request adds, and nobody adds lines to these.
#
# test/fixtures/ is excluded at the workflow's --glob rather than here,
# because some fixtures have deliberately broken frontmatter that Vale cannot
# parse at all, and a run that touches one aborts before any section applies.
# Run Vale with the same exclusion (see .github/workflows/vale.yml):
#
#   vale --glob='!test/fixtures/**' .
#
# Package source: https://github.com/hawkeyexl/moose-vale
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/hawkeyexl/moose-vale/releases/latest/download/Moose.zip

# Generated release notes. See the note above.
[**/CHANGELOG.md]
BasedOnStyles =
