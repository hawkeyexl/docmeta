name: Feature request
description: Something docmeta should be able to do and can't.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem rather than the solution. The surface docmeta
        ends up with is usually not the first one proposed, and the problem is
        the part that survives that.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get done, and where does docmeta stop you? A concrete repo, schema, or CI job beats a general principle.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: What shape is it?
      description: Best guess is fine.
      options:
        - A new flag or option on an existing command
        - A new command
        - A new built-in schema
        - A new input format
        - Output or reporter change
        - Config key
        - GitHub Action or CI integration
        - Something else
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The surface you have in mind
      description: |
        Sketch it as you would type it. Note that every subcommand is expected
        to expose a consistent surface — a new input affordance on `validate`
        should make sense on `get` and `fill` too.
      placeholder: |
        docmeta validate docs/ --something-new
      render: shell
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including what you are doing today to work around it. A workaround that is merely ugly is a different case from one that does not exist.
    validations:
      required: true

  - type: checkboxes
    id: format-path
    attributes:
      label: If this is a new input format
      description: |
        Adding one is an isolated change — a new file under `src/extractors/`,
        one line of registration, and a fixture. It never touches validation,
        schema resolution, or reporting. The path is written up in
        [CONTRIBUTING.md](https://github.com/hawkeyexl/docmeta/blob/main/CONTRIBUTING.md#adding-a-new-input-format),
        and a pull request is very welcome.
      options:
        - label: I have read the "Adding a new input format" section and may open a PR myself.
          required: false
