name: Vale

# Prose lint against the Moose house voice (Voices + Direct). Advisory for
# now: reviewdog annotates only the lines a PR adds, and errors do not fail
# the check. Flip fail_on_error once the existing corpus is worked down.
on:
  pull_request:
    paths:
      - "**.md"
      - "**.mdx"
      - ".vale.ini"

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.20.0
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: false
          # Three fixtures carry deliberately broken frontmatter (that is what
          # docmeta tests). Vale cannot parse them and aborts the whole run on
          # the first one (E201), which no level setting can downgrade, so they
          # are kept out of the run. Every other file is linted.
          vale_flags: "--glob=!{test/fixtures/dd/malformed-yaml.md,test/fixtures/get-parse-error/unparseable.md,test/fixtures/get-parse-error/toml-fences.md}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
