name: Vale

# Prose lint against the Moose house voice (Voices + Direct). reviewdog
# annotates only the lines a PR adds, and an error on one of them fails the
# check, so a failure here is always something the pull request wrote.
#
# The corpus is not at zero, and it is not meant to reach zero. Six alerts
# remain in CODE_OF_CONDUCT.md and more in the proposals marked
# `Superseded by NNNN`. Both are text this repo will not rewrite, and neither
# is exempt in .vale.ini, so that anyone who does rewrite them is told. Adding
# a line to one is what would fail this check, which is the intended answer.
# CHANGELOG.md is the one true exemption, because semantic-release writes it.
on:
  pull_request:
    paths:
      - "**.md"
      - "**.mdx"
      - ".vale.ini"
      - ".github/workflows/vale.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.20.0
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: true
          # The fixture tree is test data, not prose. Two things follow from
          # that. Some fixtures carry deliberately broken frontmatter (that is
          # what docmeta tests), which Vale cannot parse; it aborts the whole
          # run on the first one (E201), and no level setting downgrades it.
          # The rest are sample documents whose bodies describe what they
          # exercise, and holding those to a house voice would gate the
          # dedicated fixture CLAUDE.md asks for with every feature. Excluding
          # the tree covers both, and never needs updating as fixtures are
          # added. Every other file in the repo is linted.
          vale_flags: "--glob=!test/fixtures/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
