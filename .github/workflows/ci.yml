name: CI

# PRs are validated here (and commit messages by commitlint.yml). Pushes to
# release branches are validated + released by release.yml, so we don't also
# run CI on them to avoid duplicate work.
on:
  pull_request:
  workflow_dispatch:
  # Weekly, on main. Two things rot without anyone touching the code: the runner
  # images (a new ubuntu/windows/macos image, a Node patch release) and the
  # registry the lockfile resolves against. A PR-only workflow finds both at the
  # worst moment — in someone else's unrelated pull request.
  #
  # It also gives the README's build badge something true to report. ci.yml
  # deliberately does not run on pushes to main (release.yml validates those),
  # so without a schedule the badge would have no run on the default branch to
  # describe. Note that GitHub disables scheduled workflows after 60 days with
  # no repository activity; if the badge goes stale on a quiet stretch, that is
  # why.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Supersede an in-flight run for the same ref. This workflow used to be a single
# job, so a duplicate run cost little; the matrix makes it seven, and three quick
# fixups on a PR would otherwise leave twenty-one jobs running for commits nobody
# will read again. Keyed by ref rather than by PR number so the scheduled run on
# main gets its own group instead of cancelling a PR's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that can differ by platform or runtime. docmeta normalizes paths,
  # shells out to `git check-ignore`, resolves symlinks, and writes files
  # atomically — all of which behave differently across the three OSes, and none
  # of which was ever exercised anywhere but Linux until this matrix existed.
  build-test:
    name: build & test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not hide another's. With fail-fast on, the
      # first red job cancels the rest and the log says nothing about whether
      # the others would have passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 24 is the floor `engines.node` declares — inherited from
        # @hawkeyexl/inference, which requires it — so it is the oldest runtime
        # any user can be on. 26 is Current, and catches a forward break before
        # it becomes someone's upgrade.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Before `npm test`: the CLI integration suite runs against the built
      # dist/cli.js, not the sources.
      - run: npm run build
      - run: npm test

  # Platform-independent guards. These assert facts about the repository rather
  # than about the runtime, so running them once is running them enough — six
  # identical copies would only make the matrix slower.
  checks:
    name: guards & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # First, because it needs no build and fails fastest.
      - run: npm run lint
      # The three docs guards and the dogfood step all read dist/. This repeats
      # the matrix's build rather than sharing an artifact, on purpose: uploading
      # and downloading dist/ costs more wall-clock than the 8s build does, and
      # a shared artifact would couple this job to a matrix leg it does not
      # otherwise need. Not an oversight — please leave it.
      - run: npm run build
      - run: npm run docs:check-cli
      # `action.yml` is a second public surface. It had no guard, so three of its
      # seven inputs were undocumented and its one output was invisible.
      - run: npm run docs:check-action
      # `src/index.ts` is a third. A star re-export means a new interface in
      # src/types.ts becomes published API without the entry point being edited,
      # so the surface can grow with nobody deciding to grow it.
      - run: npm run docs:check-api
      # A published schema URL is a promise: its content never changes. This
      # fails if an already-published `src/schemas/<dir>/<version>.json` was
      # edited in place, or if the copies the docs site serves have drifted
      # from it. A genuine fix ships as a new version file.
      - name: Check the published built-in schemas are immutable and in sync
        run: npm run schemas:check
      # Re-runs the suite to produce the number. That duplicates the ubuntu/24
      # matrix leg by design: coverage is reported, not gated, and a report
      # nobody can see is not a report. Drop this step if the minute ever
      # matters more than the visibility.
      - run: npm run test:coverage
      # Same dogfood check the Docs workflow gates the deploy on. It only ran
      # on main before, so a docs frontmatter break could pass PR CI and then
      # fail the deploy after merge — which is exactly what happened in #52.
      #
      # Bare, with no paths and no `-s`: the targets and the schema both come
      # from the repo's own docmeta.config.yaml, so this exercises config
      # discovery — the path most users take — instead of stepping around it.
      - name: Validate docs frontmatter (dogfood)
        run: node dist/cli.js validate --format github
