name: Doc Detective

# Runs the Doc Detective inline tests embedded in the docs (.mdx) under
# docs/src/content/docs/, which exercise the documented CLI procedures using the
# exact commands the docs present (`docmeta` / `npx docmeta`) — resolved to the
# freshly built local CLI via `npm link`, not the published package. The build +
# link steps below are required: dist/ is gitignored, and docmeta is unpublished,
# so the tests would have nothing to run without them.
#
# Like ci.yml, this validates on PRs only (release.yml covers release pushes),
# scoped to changes that can affect docs<->CLI agreement.
on:
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "test/fixtures/**"
      - ".doc-detective.json"
      - ".github/workflows/doc-detective.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-detective:
    runs-on: ubuntu-latest
    # The inline tests run shell commands (docmeta ...), so never run them for
    # pull requests from forks — that would execute untrusted code on the
    # runner. Same-repo branches and manual dispatch only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build dist/, then expose it as the `docmeta` command the docs invoke.
      # `npm link` puts `docmeta` on PATH (for bare `docmeta ...`); `npm link
      # docmeta` adds node_modules/.bin/docmeta so `npx docmeta ...` resolves the
      # local build. docmeta is unpublished, so `npx docmeta` can never fetch a
      # different package — it uses the link or fails loudly.
      - run: npm run build
      - run: npm link
      - run: npm link docmeta
      # Some fill steps run a real local model, which is the only way to exercise
      # `fill` in CI at all: every other provider needs a credential, and secrets
      # are not available to this workflow. The runner has no API key and no
      # Claude CLI, so detection ends at llama-cpp exactly as it would on a
      # contributor's machine with nothing configured.
      #
      # That costs ~2.1 GB the first time — the node-llama-cpp binding (~716 MB,
      # auto-installed into the runtime prefix) plus the weights the docs name
      # (1.42 GB). Both live under one directory this library owns, so one cache
      # entry covers them.
      #
      # The key carries the alias the docs name, so `granite-4.1-3b-q2` greps to
      # both here and the `--model` in docs/src/content/docs/reference/cli.mdx.
      # Change the model there and this key must change with it: an unchanged
      # key restores a cache that lacks the new blob, and because the key still
      # hits, the download is repeated on every run and never saved back.
      #
      # The alias is `fast`, the smallest tier @hawkeyexl/inference ships. The
      # docs name it outright rather than passing the `fast` selector, because a
      # selector resolves against the runner's memory and would silently pick a
      # different, larger tier on a bigger machine — and the cache key here
      # cannot follow that.
      #
      # Timings are whatever the runner gives you. The benchmark behind this
      # model had GPU offload, so its per-page seconds do not carry over to
      # these CPU-only runners. What does carry over is that it terminates:
      # the catalog's former smallest entry, `gemma-4-e2b-q2`, did not, and is
      # marked AVOID upstream for that reason.
      #
      # A warm run adds roughly ten seconds. A cold one adds a couple of minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.hawkeyexl-inference
          key: inference-local-granite-4.1-3b-q2-${{ runner.os }}
      # Fetch the weights and auto-install the binding HERE, not inside
      # doc-detective. Doc Detective caps each step at 60s, and a cold fetch is
      # ~2.1 GB, so leaving it to the first fill step means the first run after
      # any model change times out — which is exactly what happened when this
      # key last moved. Warm, this is a few seconds and changes nothing.
      #
      # This repeats the model reference deliberately: keeping it beside the
      # cache key is what makes the alias grep to every place that must move
      # together. Keep it in step with the `--model` in cli.mdx.
      - name: Prefetch the local model
        run: >-
          docmeta fill test/fixtures/fill/no-block.md
          --provider llama-cpp
          --model granite-4.1-3b-q2
          --fields title --dry-run --no-cache
      # Third-party action pinned to a full commit SHA (supply-chain hardening).
      - uses: doc-detective/github-action@a2a4f5ceb1abfa55d567e4f6766223082ece2c18 # v1
        with:
          config: .doc-detective.json
          exit_on_fail: true
