# The only thing this repository still publishes: the built-in schema bytes at
# their original URLs (https://hawkeyexl.github.io/docmeta/schemas/…), plus a
# redirect from the old site root to manni. Proposal 0009 promised those URLs
# never change; keeping the repository, even archived, is what keeps the
# promise. Archived repositories keep serving Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r schemas site/schemas
          cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
